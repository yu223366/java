# -------------------- 后台管理（执事）权限 --------------------
# 执事不再走配置账号，改为 wushan_user 表的 role 字段：0=管理员 1=普通山友。
# 内置执事账号 admin / admin123（见 db/schema.sql 与 db/upgrade-role.sql 种子）。

# -------------------- 拍卖行 --------------------
# 场次间隔（秒）：每隔 10 分钟开一场
wushan.auction.round-interval-seconds=600
# 开拍前提前通知在线用户的秒数（默认提前 1 分钟）
wushan.auction.notify-before-seconds=60
# 每次出价后的倒计时秒数（无人再加价即落槌）
wushan.auction.countdown-seconds=5
# 每场拍品件数
wushan.auction.batch-size=5
# 起拍价（灵石）
wushan.auction.start-price=100
# 一件落槌到下一件上拍的间歇秒数
wushan.auction.item-gap-seconds=3
# 服务启动后多久开第一场（秒）
wushan.auction.first-round-delay-seconds=30
# 成交佣金比例（%），落槌时从成交价中扣除
wushan.auction.commission-percent=5
