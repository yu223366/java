# ============================================================
#  雾山五行 · 认证后端 开发环境配置
#  前端 vite 代理 /api -> http://localhost:8080
# ============================================================

spring.application.name=wushan-auth
server.port=8080

# -------------------- 数据源（MySQL） --------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/wushan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# -------------------- MyBatis-Plus --------------------
mybatis-plus.mapper-locations=classpath*:/mapper/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=

# -------------------- 认证相关自定义参数 --------------------
# 图形符印（验证码）有效期（秒）
wushan.captcha.expire-seconds=300
# 是否把图形符印明文回传（仅本地 API 联调用，便于 curl/Postman 测试；生产务必置 false）
wushan.captcha.expose-code=true

# -------------------- 后台管理（执事）账号 --------------------
# 后台只设登录不开放注册，账号由配置授权（生产请改为强口令或接入统一鉴权）
wushan.admin.username=admin
wushan.admin.password=admin123
