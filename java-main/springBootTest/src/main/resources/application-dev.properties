# ============================================================
#  雾山五行 · 认证后端 开发环境配置
#  前端 vite 代理 /api -> http://localhost:8080
# ============================================================

spring.application.name=wushan-auth
server.port=8080

# -------------------- 数据源（MySQL） --------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/wushan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# 连接池预热：默认 minimum-idle=maximum-pool-size=10 但启动时不建连，
# 第一个请求要现场握手（本地 MySQL 也要 100~300ms），表现为"刚启动时点一下卡一下"。
# 这里显式先建 5 条常驻连接，并缩短获取连接的超时等待。
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.max-lifetime=1200000
# MySQL 侧开启预编译语句缓存，模糊搜索这类高频 SQL 复用执行计划
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# -------------------- MyBatis-Plus --------------------
mybatis-plus.mapper-locations=classpath*:/mapper/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 性能：原来的 StdOutImpl 会把每条 SQL + 参数 + 结果集直接 println 到控制台。
# 控制台渲染是同步阻塞的，一次搜索能刷出几十行，Windows 终端下能拖掉几百毫秒。
# 需要看 SQL 时临时改成 org.apache.ibatis.logging.slf4j.Slf4jImpl 并把下面的 mapper 日志级别调到 debug。
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=

# -------------------- 认证相关自定义参数 --------------------
# 图形符印（验证码）有效期（秒）
wushan.captcha.expire-seconds=300
# 是否把图形符印明文回传（仅本地 API 联调用，便于 curl/Postman 测试；生产务必置 false）
wushan.captcha.expose-code=true

# -------------------- 后台管理（执事）权限 --------------------
# 执事 = wushan_user 表中 role=0 的山籍（注册默认 role=1，无法登录后台）。
# 内置执事账号 admin / admin123（db/schema.sql 种子），提升他人为执事：
#   UPDATE wushan_user SET role = 0 WHERE username = '名号';
